<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#17212b" />
  <meta name="description" content="TopGram — демонстрационный мессенджер." />
  <title>TopGram — мессенджер</title>
  <style>
:root{color-scheme:dark;--bg:#1c2733;--panel:#1c2733;--panel2:#202f40;--line:#263746;--text:#f5f7fa;--muted:#8292a2;--blue:#2aabee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer}
.app{height:100dvh;max-width:1100px;margin:auto;display:flex;flex-direction:column;background:var(--bg);position:relative}
header{height:76px;flex:none;display:flex;align-items:center;padding:0 24px;gap:18px;background:var(--bg)}
.brand{font-size:27px;font-weight:750;letter-spacing:-.5px;flex:1}
.header-btn{border:0;background:transparent;color:white;font-size:27px;width:42px;height:42px;border-radius:50%}.header-btn:hover{background:#ffffff12}
.search-wrap{display:none;padding:0 20px 14px}.search-wrap.show{display:block}.search{width:100%;padding:13px 16px;border:0;border-radius:14px;background:#263543;color:white;outline:none}
.chat-list{flex:1;overflow:auto;padding:4px 0 105px}.chat{width:100%;display:flex;align-items:center;gap:16px;padding:18px 24px;border:0;background:transparent;color:inherit;text-align:left}.chat:hover{background:#ffffff08}.avatar{width:72px;height:72px;border-radius:50%;flex:none;display:grid;place-items:center;background:#2aabee;color:white;font-weight:700;font-size:24px}.avatar.green{background:#39735d}.avatar.purple{background:#65518a}.avatar.orange{background:#94613e}.meta{min-width:0;flex:1}.chat-top{display:flex;align-items:center;gap:8px}.chat-name{font-size:20px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.time{font-size:13px;color:var(--muted)}.preview{font-size:17px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:8px}
.empty{margin:auto;text-align:center;color:var(--muted);padding:32px;max-width:420px}.empty strong{display:block;color:var(--text);font-size:20px;margin-bottom:8px}
.bottom-nav{position:absolute;bottom:18px;left:4%;right:4%;height:88px;border-radius:48px;background:#202f40;display:flex;align-items:center;justify-content:space-around;padding:6px;box-shadow:0 5px 22px #0002}
.nav-btn{height:76px;min-width:0;flex:1;border:0;background:transparent;color:white;border-radius:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;font-weight:600}.nav-btn .ico{font-size:28px;line-height:1.1}.nav-btn.active{background:#1c3852;color:#2aabee}
.main{display:none;flex:1;min-height:0;flex-direction:column}.app.open-chat .chat-list,.app.open-chat .bottom-nav,.app.open-chat .search-wrap{display:none}.app.open-chat .main{display:flex}
.chat-head{height:70px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid #ffffff0d}.chat-head .avatar{width:44px;height:44px;font-size:17px}.chat-head strong{flex:1}.back{border:0;background:transparent;color:white;font-size:27px}
.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:min(78%,540px);padding:10px 14px 7px;background:#263746;border-radius:14px 14px 14px 4px;align-self:flex-start;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#285577;border-radius:14px 14px 4px 14px}.stamp{display:block;text-align:right;color:#b6c9d8;font-size:11px;margin-top:4px}
.composer{display:flex;gap:10px;padding:12px 16px 18px;background:var(--bg)}.composer input{flex:1;min-width:0;border:0;border-radius:24px;background:#263543;color:white;padding:14px 18px;outline:none}.send{border:0;border-radius:50%;width:48px;height:48px;background:var(--blue);color:white;font-size:22px}
.modal-backdrop{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:18px;z-index:5}.modal-backdrop.show{display:grid}.modal{width:min(420px,100%);background:#202f40;border:1px solid #34485a;border-radius:18px;padding:22px}.modal h2{margin:0 0 16px}.modal input{width:100%;padding:12px;border-radius:10px;background:#263543;border:1px solid #34485a;color:white;margin:7px 0 14px}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.modal-actions button{padding:10px 14px;border-radius:9px;border:0;background:#34485a;color:white}.modal-actions .primary{background:#229ed9}
.notice{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:#263746;color:white;padding:10px 16px;border-radius:12px;display:none;z-index:8}.notice.show{display:block}
@media(min-width:760px){.app{max-width:100%;}.chat-list{padding-left:max(0px,calc((100% - 900px)/2));padding-right:max(0px,calc((100% - 900px)/2))}.bottom-nav{max-width:760px;left:50%;right:auto;width:calc(100% - 48px);transform:translateX(-50%)}}
</style>
</head>
<body>
<div class="app" id="app">
<header><div class="brand">TopGram</div><button class="header-btn" id="searchToggle" aria-label="Поиск">⌕</button><button class="header-btn" id="menuBtn" aria-label="Меню">⋮</button></header>
<div class="search-wrap" id="searchWrap"><input class="search" id="search" placeholder="Поиск чатов и пользователей…" autocomplete="off"></div>
<div class="chat-list" id="chatList"></div>
<main class="main" id="main"><div class="chat-head" id="chatHead"></div><section class="messages" id="messages"></section><form class="composer" id="composer"><input id="messageInput" placeholder="Сообщение…" autocomplete="off"><button class="send" type="submit" aria-label="Отправить">➤</button></form></main>
<nav class="bottom-nav"><button class="nav-btn active" id="chatsTab"><span class="ico">●●</span>Чаты</button><button class="nav-btn" id="contactsTab"><span class="ico">◎</span>Контакты</button><button class="nav-btn" id="settingsTab"><span class="ico">⚙</span>Настройки</button><button class="nav-btn" id="profileTab"><span class="ico">●</span>Профиль</button></nav>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="modal-actions"><button id="cancelModal">Отмена</button><button class="primary" id="confirmModal">Готово</button></div></div></div><div class="notice" id="notice"></div><script>
(()=>{
const $=id=>document.getElementById(id), oldDemo=new Set(['alex','team','maria','design']);
let chats=[];try{chats=JSON.parse(localStorage.getItem('topgram-chats'))||[]}catch{}
chats=chats.filter(c=>!oldDemo.has(c.id));let activeId=null,modalAction=null;
const save=()=>localStorage.setItem('topgram-chats',JSON.stringify(chats));
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>new Intl.DateTimeFormat('ru-RU',{hour:'2-digit',minute:'2-digit'}).format(new Date());
function toast(t){$('notice').textContent=t;$('notice').classList.add('show');setTimeout(()=>$('notice').classList.remove('show'),2200)}
function render(){let q=$('search').value.toLowerCase().trim();let list=chats.filter(c=>(c.name+' '+(c.handle||'')+' '+(c.last||'')).toLowerCase().includes(q)).sort((a,b)=>(b.updated||0)-(a.updated||0));$('chatList').innerHTML=list.length?list.map(c=>'<button class="chat" data-id="'+esc(c.id)+'"><div class="avatar '+esc(c.color||'')+'">'+esc(initials(c.name))+'</div><div class="meta"><div class="chat-top"><span class="chat-name">'+esc(c.name)+'</span><span class="time">'+esc(c.time||'')+'</span></div><div class="preview">'+esc(c.last||'Нет сообщений')+'</div></div></button>').join(''):'<div class="empty"><strong>Пока нет чатов</strong>Здесь появятся только диалоги, которые ты начнёшь сам или в которых тебе напишут.</div>';document.querySelectorAll('.chat[data-id]').forEach(b=>b.onclick=()=>select(b.dataset.id))}
function select(id){let c=chats.find(x=>x.id===id);if(!c)return;activeId=id;$('app').classList.add('open-chat');$('chatHead').innerHTML='<button class="back" id="back">‹</button><div class="avatar '+esc(c.color||'')+'">'+esc(initials(c.name))+'</div><strong>'+esc(c.name)+'</strong><button class="header-btn" id="chatMenu">⋮</button>';$('back').onclick=()=>$('app').classList.remove('open-chat');$('chatMenu').onclick=()=>profile(c);$('messages').innerHTML=c.messages.map(m=>'<div class="bubble '+(m.mine?'mine':'')+'">'+esc(m.text)+'<span class="stamp">'+esc(m.time)+'</span></div>').join('');$('messages').scrollTop=$('messages').scrollHeight;render()}
$('composer').onsubmit=e=>{e.preventDefault();let input=$('messageInput'),text=input.value.trim(),c=chats.find(x=>x.id===activeId);if(!text||!c)return;let time=now();c.messages.push({text,mine:true,time});c.last=text;c.time=time;c.updated=Date.now();save();input.value='';select(c.id)};
function modal(title,body,action,label='Готово'){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('confirmModal').textContent=label;modalAction=action;$('modalBackdrop').classList.add('show')}
function close(){ $('modalBackdrop').classList.remove('show');modalAction=null}
$('cancelModal').onclick=close;$('confirmModal').onclick=()=>modalAction&&modalAction();$('modalBackdrop').onclick=e=>{if(e.target===$('modalBackdrop'))close()};
$('menuBtn').onclick=()=>modal('TopGram','<p>TopGram — твои разговоры, без выдуманных диалогов.</p><p style="color:#8292a2;font-size:13px">Сейчас это локальная демоверсия: сообщения сохраняются на этом устройстве. Для получения сообщений от других людей нужен сервер.</p>',close,'Понятно');
$('searchToggle').onclick=()=>{$('searchWrap').classList.toggle('show');if($('searchWrap').classList.contains('show'))$('search').focus()};
$('search').oninput=render;
function newChat(){modal('Новый чат','<label for="newName">Имя или @username</label><input id="newName" placeholder="@username" autocomplete="off">',()=>{let name=$('newName').value.trim().replace(/^@/, '');if(!name)return toast('Введи имя пользователя');let found=chats.find(c=>(c.handle||'').toLowerCase()==='@'+name.toLowerCase());if(found){close();select(found.id);return}let id='chat-'+Date.now();chats.push({id,name,handle:'@'+name,type:'person',messages:[],last:'',time:now(),updated:Date.now()});save();close();select(id);toast('Диалог создан')},'Открыть')}
$('contactsTab').onclick=newChat;
$('chatsTab').onclick=()=>{$('app').classList.remove('open-chat');document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));$('chatsTab').classList.add('active')};
$('settingsTab').onclick=()=>modal('Настройки','<p>Настройки TopGram появятся здесь.</p>',close,'Закрыть');
function profile(c){modal('Профиль','<div style="text-align:center"><div class="avatar" style="margin:0 auto 12px">'+esc(initials(c.name))+'</div><strong>'+esc(c.name)+'</strong><p style="color:#8292a2">'+esc(c.handle||'TopGram')+'</p></div>',close,'Закрыть')}
$('profileTab').onclick=()=>modal('Профиль','<p>Локальный профиль TopGram.</p><p style="color:#8292a2;font-size:13px">Регистрация и синхронизация между устройствами будут доступны после подключения сервера.</p>',close,'Закрыть');
render();save();
})();
</script></body>
</html>
