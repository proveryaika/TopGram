/* Pixel-focused layout matching the supplied TopGram references */
:root{--bg:#17212b;--panel:#202f40;--panel-soft:#263543;--muted:#81909e;--blue:#2aabee}
body{background:var(--bg)}
.app{max-width:none;background:var(--bg);height:100dvh;overflow:hidden}
header{height:94px;padding:0 26px;gap:16px}
.brand{font-size:30px;font-weight:750;letter-spacing:-.7px}
.header-btn{width:48px;height:48px;font-size:30px}
#searchToggle{font-size:0;position:relative}
#searchToggle:before{content:"";position:absolute;width:20px;height:20px;border:3px solid #fff;border-radius:50%;left:10px;top:9px}
#searchToggle:after{content:"";position:absolute;width:12px;height:3px;background:#fff;transform:rotate(48deg);left:29px;top:31px;border-radius:2px}
#menuBtn{font-size:0;position:relative}
#menuBtn:before{content:"⋮";font-size:32px;line-height:1}
.chat-list{padding:0 0 116px}
.chat{padding:18px 24px;gap:16px}
.avatar{width:76px;height:76px;font-size:25px}
.chat-name{font-size:20px}
.preview{font-size:17px;margin-top:8px}
.empty{font-size:15px}
.bottom-nav{bottom:18px;left:4.2%;right:4.2%;height:88px;border-radius:48px;background:#202f40;padding:5px;gap:2px}
.nav-btn{height:78px;font-size:15px;font-weight:650;gap:4px}
.nav-btn .ico{width:32px;height:32px;font-size:0;display:grid;place-items:center}
.nav-btn.active{background:#1c3852;color:#2aabee}
.nav-btn .ico svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app.profile-open header{display:none}
.profile-view{padding:14px 28px 128px;overflow:auto}
.profile-tools{align-items:center;margin:0 -14px 0}
.round-tool{width:58px;height:58px;background:#263543;border:1px solid #344452;font-size:0;display:grid;place-items:center}
.round-tool svg{width:27px;height:27px;stroke:white;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.profile-center{padding:0 0 0;margin-top:-38px}
.profile-photo{width:220px;height:220px;margin:0 auto 65px;font-size:36px;background:linear-gradient(150deg,#60c9dc,#269bd8)}
.profile-name{display:none}
.profile-status{font-size:18px;line-height:1.45;margin-top:0;color:var(--muted)}
.profile-actions{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:58px 0 34px}
.profile-action{min-height:124px;border-radius:34px;background:#293846;font-size:16px;padding:10px 4px;gap:7px}
.profile-action span{font-size:37px;line-height:1}
.profile-phone{border-radius:32px;padding:20px 24px;margin:0 0 28px;background:#202c39;min-height:118px}
.profile-phone strong{font-size:24px;line-height:1.35}
.profile-phone span{font-size:18px;margin-top:8px}
.profile-tabs{max-width:560px;border-radius:44px;padding:5px}
.profile-tab{font-size:17px;padding:11px 7px}
.posts-empty{margin:104px auto 0}
.posts-empty strong{font-size:27px}
.posts-empty p{font-size:19px;line-height:1.3}
.add-post{position:sticky;bottom:0;margin:100px auto 8px;border-radius:42px;padding:15px 38px;font-size:22px;box-shadow:0 0 0 4px #ffffff12}
.app.profile-open .bottom-nav{display:flex}
@media(max-width:600px){
header{height:94px;padding:0 24px}
.profile-view{padding:14px 28px 128px}
.profile-tools{margin:0 -14px}
.profile-photo{width:220px;height:220px;margin-bottom:65px}
.profile-actions{gap:12px;margin:58px 0 34px}
.profile-action{min-height:124px;font-size:15px;border-radius:34px}
.profile-phone{min-height:118px;padding:20px 24px}
.posts-empty{margin-top:104px}
.bottom-nav{left:4.2%;right:4.2%;bottom:18px}
}
@media(max-height:760px){
.profile-photo{width:170px;height:170px;margin-bottom:34px}
.profile-actions{margin:28px 0 20px}
.profile-action{min-height:92px}
.posts-empty{margin-top:55px}
.add-post{margin-top:45px}
}
</style>

<body>
<div class="app" id="app">
<header><div class="brand">TopGram</div><button class="header-btn" id="searchToggle" aria-label="Поиск"></button><button class="header-btn" id="menuBtn" aria-label="Меню">⋮</button></header>

<div class="chat-list" id="chatList"></div>
<section class="profile-view" id="profileView"><div class="profile-tools"><button class="round-tool" id="qrBtn" aria-label="QR-код"><svg viewBox="0 0 24 24"><rect x="2.5" y="2.5" width="7" height="7" rx="1.5"/><rect x="14.5" y="2.5" width="7" height="7" rx="1.5"/><rect x="2.5" y="14.5" width="7" height="7" rx="1.5"/><path d="M14.5 14.5h2v2h-2zM19.5 14.5h2M14.5 19.5h2M19.5 19.5h2v2h-2z"/></svg></button><button class="round-tool" id="profileMenu" aria-label="Меню">⋮</button></div><div class="profile-center"><div class="profile-photo" id="profilePhoto">•</div><div class="profile-name" id="profileName">Пользователь TopGram</div><div class="profile-status">•<br>В сети</div></div><div class="profile-actions"><button class="profile-action" id="choosePhoto"><span>📷</span>Выбрать фото</button><button class="profile-action" id="editProfile"><span>✎</span>Изменить</button><button class="profile-action" id="profileSettings"><span>⚙</span>Настройки</button></div><div class="profile-phone"><strong id="profilePhone">Будет назначен позже</strong><span>Телефон</span></div><div class="profile-tabs"><button class="profile-tab active" id="publicationsTab">Публикации</button><button class="profile-tab" id="archiveTab">Архив публикаций</button></div><div id="postsArea"></div><button class="add-post" id="addPost">📷 &nbsp;Добавить</button><input type="file" id="photoInput" accept="image/*" hidden></section><main class="main" id="main"><div class="chat-head" id="chatHead"></div><section class="messages" id="messages"></section><form class="composer" id="composer"><input id="messageInput" placeholder="Сообщение…" autocomplete="off"><button class="send" type="submit" aria-label="Отправить">➤</button></form></main>
<nav class="bottom-nav"><button class="nav-btn active" id="chatsTab"><span class="ico"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-4-.9L3 21l1.9-4.7A8.5 8.5 0 1 1 21 11.5Z"/><path d="M8 21a8 8 0 0 0 13-6"/></svg></span>Чаты</button><button class="nav-btn" id="contactsTab"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>Контакты</button><button class="nav-btn" id="settingsTab"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.2.9-1.2 2.1-1.4-.5a8 8 0 0 1-1.6.9l-.2 1.5h-2.5l-.3-1.5a8 8 0 0 1-1.6-.9l-1.4.5-1.2-2.1 1.2-.9a7 7 0 0 1 0-1.9l-1.2-.9 1.2-2.1 1.4.5a8 8 0 0 1 1.6-.9l.3-1.5h2.5l.2 1.5a8 8 0 0 1 1.6.9l1.4-.5 1.2 2.1-1.2.9a7 7 0 0 1 0 1.9Z"/></svg></span>Настройки</button><button class="nav-btn" id="profileTab"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="9" r="3"/><path d="M5.5 19a7 7 0 0 1 13 0"/></svg></span>Профиль</button></nav>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="modal-actions"><button id="cancelModal">Отмена</button><button class="primary" id="confirmModal">Готово</button></div></div></div><div class="notice" id="notice"></div><script>
(()=>{
const $=id=>document.getElementById(id), oldDemo=new Set(['alex','team','maria','design']);
let chats=[];try{chats=JSON.parse(localStorage.getItem('topgram-chats'))||[]}catch{}
chats=chats.filter(c=>!oldDemo.has(c.id));let activeId=null,modalAction=null;let profileData={name:'Пользователь TopGram',photo:'',phone:'',posts:[],archive:[]};try{profileData={...profileData,...JSON.parse(localStorage.getItem('topgram-profile')||'{}')}}catch{}const saveProfile=()=>localStorage.setItem('topgram-profile',JSON.stringify(profileData));let showingArchive=false;
const save=()=>localStorage.setItem('topgram-chats',JSON.stringify(chats));
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>new Intl.DateTimeFormat('ru-RU',{hour:'2-digit',minute:'2-digit'}).format(new Date());
function toast(t){$('notice').textContent=t;$('notice').classList.add('show');setTimeout(()=>$('notice').classList.remove('show'),2200)}
function render(){let q=$('search').value.toLowerCase().trim();let list=chats.filter(c=>(c.name+' '+(c.handle||'')+' '+(c.last||'')).toLowerCase().includes(q)).sort((a,b)=>(b.updated||0)-(a.updated||0));$('chatList').innerHTML=list.length?list.map(c=>'<button class="chat" data-id="'+esc(c.id)+'"><div class="avatar '+esc(c.color||'')+'">'+esc(initials(c.name))+'</div><div class="meta"><div class="chat-top"><span class="chat-name">'+esc(c.name)+'</span><span class="time">'+esc(c.time||'')+'</span></div><div class="preview">'+esc(c.last||'Нет сообщений')+'</div></div></button>').join(''):'<div class="empty"><strong>Пока нет чатов</strong>Здесь появятся только диалоги, которые ты начнёшь сам или в которых тебе напишут.</div>';document.querySelectorAll('.chat[data-id]').forEach(b=>b.onclick=()=>select(b.dataset.id))}
function select(id){$('app').classList.remove('profile-open');document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));$('chatsTab').classList.add('active');let c=chats.find(x=>x.id===id);if(!c)return;activeId=id;$('app').classList.add('open-chat');$('chatHead').innerHTML='<button class="back" id="back">‹</button><div class="avatar '+esc(c.color||'')+'">'+esc(initials(c.name))+'</div><strong>'+esc(c.name)+'</strong><button class="header-btn" id="chatMenu">⋮</button>';$('back').onclick=()=>$('app').classList.remove('open-chat');$('chatMenu').onclick=()=>profile(c);$('messages').innerHTML=c.messages.map(m=>'<div class="bubble '+(m.mine?'mine':'')+'">'+esc(m.text)+'<span class="stamp">'+esc(m.time)+'</span></div>').join('');$('messages').scrollTop=$('messages').scrollHeight;render()}
$('composer').onsubmit=e=>{e.preventDefault();let input=$('messageInput'),text=input.value.trim(),c=chats.find(x=>x.id===activeId);if(!text||!c)return;let time=now();c.messages.push({text,mine:true,time});c.last=text;c.time=time;c.updated=Date.now();save();input.value='';select(c.id)};
function modal(title,body,action,label='Готово'){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('confirmModal').textContent=label;modalAction=action;$('modalBackdrop').classList.add('show')}
function close(){ $('modalBackdrop').classList.remove('show');modalAction=null}
$('cancelModal').onclick=close;$('confirmModal').onclick=()=>modalAction&&modalAction();$('modalBackdrop').onclick=e=>{if(e.target===$('modalBackdrop'))close()};
$('menuBtn').onclick=()=>modal('TopGram','<p>TopGram — твои разговоры, без выдуманных диалогов.</p><p style="color:#8292a2;font-size:13px">Сейчас это локальная демоверсия: сообщения сохраняются на этом устройстве. Для получения сообщений от других людей нужен сервер.</p>',close,'Понятно');
$('searchToggle').onclick=()=>{$('searchWrap').classList.toggle('show');if($('searchWrap').classList.contains('show'))$('search').focus()};
$('search').oninput=render;
function newChat(){modal('Новый чат','<label for="newName">Имя или @username</label><input id="newName" placeholder="@username" autocomplete="off">',()=>{let name=$('newName').value.trim().replace(/^@/, '');if(!name)return toast('Введи имя пользователя');let found=chats.find(c=>(c.handle||'').toLowerCase()==='@'+name.toLowerCase());if(found){close();select(found.id);return}let id='chat-'+Date.now();chats.push({id,name,handle:'@'+name,type:'person',messages:[],last:'',time:now(),updated:Date.now()});save();close();select(id);toast('Диалог создан')},'Открыть')}
$('contactsTab').onclick=newChat;
$('chatsTab').onclick=()=>{$('app').classList.remove('profile-open');$('app').classList.remove('open-chat');document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));$('chatsTab').classList.add('active')};
$('settingsTab').onclick=()=>{document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));$('settingsTab').classList.add('active');modal('Настройки','<p>Настройки демоверсии TopGram</p>',close,'Закрыть')};
function renderProfile(){
$('profileName').textContent=profileData.name;

$('addPost').style.display=showingArchive?'none':'block';
}
$('profileTab').onclick=()=>{$('app').classList.remove('open-chat');$('app').classList.add('profile-open');document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));$('profileTab').classList.add('active');renderProfile()};
$('choosePhoto').onclick=()=>$('photoInput').click();
$('photoInput').onchange=e=>{const file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/'))return toast('Выбери изображение');if(file.size>3*1024*1024)return toast('Фото должно быть меньше 3 МБ');const reader=new FileReader();reader.onload=()=>{profileData.photo=reader.result;saveProfile();renderProfile();toast('Фото профиля обновлено')};reader.readAsDataURL(file);e.target.value=''};
$('editProfile').onclick=()=>modal('Изменить профиль','<label for="profileNameInput">Имя</label><input id="profileNameInput" maxlength="40" value="'+esc(profileData.name)+'" placeholder="Твоё имя">',()=>{let v=$('profileNameInput').value.trim();if(!v)return toast('Имя не должно быть пустым');profileData.name=v;saveProfile();renderProfile();close();toast('Профиль обновлён')},'Сохранить');
$('profileSettings').onclick=()=>modal('Настройки профиля','<p>Фото и имя профиля сохраняются на этом устройстве.</p><p style="color:#8292a2;font-size:13px">Номер телефона пока не подключён. В будущей версии он будет отображаться после назначения системой TopGram.</p>',close,'Понятно');
$('profileMenu').onclick=()=>$('profileSettings').click();
$('qrBtn').onclick=()=>modal('QR профиля','<div style="text-align:center"><div style="font-size:48px;margin:16px">▦</div><strong>'+esc(profileData.name)+'</strong><p style="color:#8292a2">QR-код появится после подключения аккаунтов TopGram.</p></div>',close,'Закрыть');
$('publicationsTab').onclick=()=>{showingArchive=false;$('publicationsTab').classList.add('active');$('archiveTab').classList.remove('active');renderProfile()};
$('archiveTab').onclick=()=>{showingArchive=true;$('archiveTab').classList.add('active');$('publicationsTab').classList.remove('active');renderProfile()};
$('addPost').onclick=()=>modal('Новая публикация','<label for="postText">Текст публикации</label><input id="postText" maxlength="300" placeholder="Что нового?">',()=>{let text=$('postText').value.trim();if(!text)return toast('Напиши текст публикации');profileData.posts.unshift({text:text,created:Date.now()});saveProfile();close();renderProfile();toast('Публикация добавлена')},'Опубликовать');

function profile(c){modal('Профиль','<div style="text-align:center"><div class="avatar" style="margin:0 auto 12px">'+esc(initials(c.name))+'</div><strong>'+esc(c.name)+'</strong><p style="color:#8292a2">'+esc(c.handle||'TopGram')+'</p></div>',close,'Закрыть')}

render();save();renderProfile();
})();
</script></body>
</html>
