<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#17212b" />
  <meta name="description" content="TopGram — демонстрационный мессенджер." />
  <title>TopGram — мессенджер</title>
  <style>
    :root{color-scheme:dark;--bg:#0e1621;--panel:#17212b;--panel2:#202b36;--line:#263746;--text:#f5f7f9;--muted:#8d9cab;--blue:#2aabee;--blue2:#229ed9;--green:#4fae4e}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer}
    .app{height:100dvh;max-width:1500px;margin:auto;display:grid;grid-template-columns:340px minmax(0,1fr);background:var(--panel)}
    .sidebar{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.brand{height:68px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line)}
    .logo{width:40px;height:40px;border-radius:13px;background:var(--blue2);display:grid;place-items:center;font-size:21px;font-weight:800}.brand strong{font-size:20px;letter-spacing:.2px}.brand small{display:block;color:var(--muted);font-size:11px}
    .search-wrap{padding:14px 14px 8px}.search{width:100%;border:1px solid transparent;background:var(--panel2);border-radius:12px;padding:12px 14px;color:var(--text);outline:none}.search:focus{border-color:var(--blue)}
    .section-head{display:flex;justify-content:space-between;align-items:center;padding:12px 18px 8px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.09em}.icon-btn{border:0;background:transparent;color:var(--blue);font-size:22px;border-radius:9px;width:34px;height:34px}.icon-btn:hover{background:var(--panel2)}
    .chat-list{overflow:auto;flex:1}.chat{width:100%;display:flex;gap:12px;align-items:center;text-align:left;padding:12px 16px;border:0;border-top:1px solid rgba(255,255,255,.025);background:transparent;color:inherit}.chat:hover{background:#1d2a36}.chat.active{background:#2b5278}.avatar{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;background:#385c78;color:white;font-weight:700;font-size:17px}.avatar.green{background:#39735d}.avatar.purple{background:#65518a}.avatar.orange{background:#94613e}.chat-meta{min-width:0;flex:1}.chat-top{display:flex;justify-content:space-between;gap:8px}.chat-name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time,.preview{font-size:12px;color:var(--muted)}.preview{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
    .side-bottom{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px}.side-bottom button{flex:1;background:var(--panel2);border:0;color:var(--text);padding:10px 8px;border-radius:10px;font-size:12px}.side-bottom button:hover{background:#2a3a49}
    .main{display:flex;flex-direction:column;min-width:0;min-height:0;background:#0e1621}.topbar{height:68px;display:flex;align-items:center;padding:0 22px;border-bottom:1px solid var(--line);background:var(--panel);gap:12px}.topbar .avatar{width:42px;height:42px}.top-info{flex:1}.top-info strong{display:block}.online{font-size:12px;color:#66c58b}.top-actions{display:flex;gap:8px}.top-actions button{border:0;background:var(--panel2);color:var(--muted);padding:9px 12px;border-radius:9px}
    .messages{flex:1;overflow:auto;padding:26px max(22px,calc((100% - 780px)/2));display:flex;flex-direction:column;gap:12px;background:radial-gradient(ellipse at top,#172635 0%,#0e1621 60%)}
    .day{text-align:center;color:var(--muted);font-size:11px;margin:4px auto 12px;background:#1c2a37;padding:5px 12px;border-radius:20px}.bubble{max-width:min(72%,520px);padding:10px 13px 7px;background:#182533;border-radius:14px 14px 14px 4px;box-shadow:0 1px 2px #0003;align-self:flex-start;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#24577a;border-radius:14px 14px 4px 14px}.bubble .stamp{display:block;text-align:right;color:#a9c5d8;font-size:10px;margin-top:4px}
    .composer-wrap{padding:14px 22px 18px;background:var(--panel);border-top:1px solid var(--line)}.composer{max-width:820px;margin:auto;display:flex;gap:10px;align-items:center}.composer input{flex:1;min-width:0;background:var(--panel2);border:1px solid transparent;border-radius:24px;padding:13px 18px;color:var(--text);outline:none}.composer input:focus{border-color:var(--blue)}.send{border:0;border-radius:50%;width:46px;height:46px;background:var(--blue2);color:white;font-size:20px}.send:hover{background:var(--blue)}
    .empty{margin:auto;text-align:center;color:var(--muted);padding:30px}.empty strong{display:block;color:var(--text);font-size:19px;margin-bottom:6px}
    .modal-backdrop{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:18px;z-index:5}.modal-backdrop.show{display:grid}.modal{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 20px 70px #0008}.modal h2{margin:0 0 16px}.modal input{width:100%;padding:12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--text);margin:7px 0 14px}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.modal-actions button{padding:10px 14px;border-radius:9px;border:0;background:var(--panel2);color:var(--text)}.modal-actions .primary{background:var(--blue2)}
    .notice{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#263746;color:white;padding:10px 16px;border-radius:12px;display:none;z-index:8;box-shadow:0 8px 30px #0006}.notice.show{display:block}
    @media(max-width:720px){.app{grid-template-columns:1fr}.sidebar{display:flex}.main{display:none}.app.open-chat .sidebar{display:none}.app.open-chat .main{display:flex}.topbar{padding:0 14px}.messages{padding:18px 14px}.composer-wrap{padding:10px 12px 14px}.side-bottom{padding:8px}.chat{padding:10px 14px}.back{display:inline-block!important}.top-actions .label{display:none}}
    .back{display:none}
  </style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">➤</div><div><strong>TopGram</strong><small>Твои разговоры — твой мир</small></div></div>
    <div class="search-wrap"><input class="search" id="search" placeholder="Поиск чатов и пользователей…" autocomplete="off" /></div>
    <div class="section-head"><span>Сообщения</span><button class="icon-btn" id="newChat" title="Новый чат">＋</button></div>
    <div class="chat-list" id="chatList"></div>
    <div class="side-bottom"><button id="groupsBtn">▣ Группы</button><button id="profileBtn">◉ Профиль</button></div>
  </aside>
  <main class="main">
    <header class="topbar" id="topbar"><div class="empty"><strong>Добро пожаловать в TopGram</strong>Выбери чат слева или начни новый разговор.</div></header>
    <section class="messages" id="messages"><div class="empty"><strong>Привет!</strong>Это демоверсия TopGram. Выбери диалог, чтобы начать.</div></section>
    <form class="composer-wrap" id="composer"><div class="composer"><input id="messageInput" placeholder="Написать сообщение…" autocomplete="off" disabled /><button class="send" type="submit" aria-label="Отправить" disabled>➤</button></div></form>
  </main>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="modal-actions"><button id="cancelModal">Отмена</button><button class="primary" id="confirmModal">Создать</button></div></div></div>
<div class="notice" id="notice"></div>
<script>
(() => {
  const starter = [
    {id:'alex',name:'Алекс',handle:'@alex',type:'person',color:'',last:'Привет! Добро пожаловать в TopGram 👋',time:'21:42',messages:[{text:'Привет! Добро пожаловать в TopGram 👋',mine:false,time:'21:42'},{text:'Спасибо! Рад попробовать новый мессенджер.',mine:true,time:'21:43'}]},
    {id:'team',name:'TopGram Community',handle:'',type:'group',color:'green',last:'Обсуждаем идеи для проекта',time:'20:15',messages:[{text:'Добро пожаловать в наше сообщество!',mine:false,time:'20:10'},{text:'Обсуждаем идеи для проекта',mine:false,time:'20:15'}]},
    {id:'maria',name:'Мария',handle:'@maria',type:'person',color:'purple',last:'Отличный интерфейс!',time:'19:30',messages:[{text:'Привет! Как тебе TopGram?',mine:false,time:'19:28'},{text:'Отличный интерфейс!',mine:false,time:'19:30'}]},
    {id:'design',name:'Дизайн и идеи',handle:'',type:'group',color:'orange',last:'Набросал пару предложений',time:'Вчера',messages:[{text:'Набросал пару предложений',mine:false,time:'18:05'}]}
  ];
  let chats = load();
  let activeId = null;
  let modalAction = null;
  const $ = id => document.getElementById(id);
  function load(){try{return JSON.parse(localStorage.getItem('topgram-chats')) || starter}catch{return starter}}
  function save(){localStorage.setItem('topgram-chats',JSON.stringify(chats))}
  function initials(name){return name.trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function toast(msg){$('notice').textContent=msg;$('notice').classList.add('show');setTimeout(()=>$('notice').classList.remove('show'),2200)}
  function renderList(){
    const q=$('search').value.toLowerCase().trim();
    const filtered=chats.filter(c=>(c.name+' '+(c.handle||'')+' '+c.last).toLowerCase().includes(q));
    $('chatList').innerHTML=filtered.length?filtered.map(c=>`<button class="chat ${c.id===activeId?'active':''}" data-id="${c.id}"><div class="avatar ${c.color}">${escapeHtml(initials(c.name))}</div><div class="chat-meta"><div class="chat-top"><span class="chat-name">${escapeHtml(c.name)}</span><span class="time">${escapeHtml(c.time||'')}</span></div><div class="preview">${c.type==='group'?'▣ ':''}${escapeHtml(c.last||'Нет сообщений')}</div></div></button>`).join(''):'<div class="empty">Ничего не найдено</div>';
    document.querySelectorAll('.chat[data-id]').forEach(el=>el.addEventListener('click',()=>selectChat(el.dataset.id)));
  }
  function selectChat(id){
    activeId=id;const c=chats.find(x=>x.id===id);if(!c)return;
    $('app').classList.add('open-chat');
    $('topbar').innerHTML=`<button class="icon-btn back" id="backBtn" aria-label="Назад">‹</button><div class="avatar ${c.color}">${escapeHtml(initials(c.name))}</div><div class="top-info"><strong>${escapeHtml(c.name)}</strong><span class="online">${c.type==='group'?'Группа':'был(а) недавно'}</span></div><div class="top-actions"><button id="infoBtn">Профиль</button></div>`;
    $('backBtn').addEventListener('click',()=>$('app').classList.remove('open-chat'));
    $('infoBtn').addEventListener('click',()=>showProfile(c));
    $('messages').innerHTML='<div class="day">Сегодня</div>'+c.messages.map(m=>`<div class="bubble ${m.mine?'mine':''}">${escapeHtml(m.text)}<span class="stamp">${escapeHtml(m.time)}</span></div>`).join('');
    $('messageInput').disabled=false;$('composer').querySelector('button').disabled=false;$('messageInput').focus();
    $('messages').scrollTop=$('messages').scrollHeight;renderList();
  }
  function currentTime(){return new Intl.DateTimeFormat('ru-RU',{hour:'2-digit',minute:'2-digit'}).format(new Date())}
  $('composer').addEventListener('submit',e=>{
    e.preventDefault();const input=$('messageInput'),text=input.value.trim(),c=chats.find(x=>x.id===activeId);if(!text||!c)return;
    const time=currentTime();c.messages.push({text,mine:true,time});c.last=text;c.time=time;save();input.value='';selectChat(c.id);
  });
  function openModal(title,body,action,label='Создать'){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('confirmModal').textContent=label;modalAction=action;$('modalBackdrop').classList.add('show');const inp=$('modalBody').querySelector('input');if(inp)inp.focus()}
  function closeModal(){$('modalBackdrop').classList.remove('show');modalAction=null}
  $('cancelModal').onclick=closeModal;$('confirmModal').onclick=()=>{if(modalAction)modalAction();};
  $('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal()});
  $('newChat').onclick=()=>openModal('Новый чат','<label for="newName">Имя пользователя</label><input id="newName" placeholder="Например, @newfriend" />',()=>{
    const value=$('newName').value.trim().replace(/^@/,'');if(!value)return toast('Введи имя пользователя');
    const existing=chats.find(c=>c.handle?.toLowerCase()==='@'+value.toLowerCase());if(existing){closeModal();selectChat(existing.id);return}
    const id='user-'+Date.now(),name=value.charAt(0).toUpperCase()+value.slice(1);chats.unshift({id,name,handle:'@'+value,type:'person',color:'',last:'Новый диалог',time:currentTime(),messages:[]});save();closeModal();selectChat(id);toast('Демо-чат создан');
  });
  $('groupsBtn').onclick=()=>openModal('Создать группу','<label for="groupName">Название группы</label><input id="groupName" placeholder="Например, Команда TopGram" />',()=>{
    const name=$('groupName').value.trim();if(!name)return toast('Введи название группы');const id='group-'+Date.now();chats.unshift({id,name,type:'group',color:'green',last:'Группа создана',time:currentTime(),messages:[{text:'Группа создана. Добро пожаловать!',mine:false,time:currentTime()}]});save();closeModal();selectChat(id);toast('Группа создана');
  });
  function showProfile(c){openModal('Профиль',`<div style="text-align:center;padding:8px"><div class="avatar" style="margin:0 auto 12px;width:66px;height:66px;font-size:24px">${escapeHtml(initials(c.name))}</div><strong style="font-size:18px">${escapeHtml(c.name)}</strong><p style="color:var(--muted)">${escapeHtml(c.handle||'Групповой чат')}</p><p style="color:var(--muted);font-size:13px">Профили и аккаунты будут подключены к Supabase на следующем этапе.</p></div>`,closeModal,'Закрыть')}
  $('profileBtn').onclick=()=>openModal('Мой профиль','<label>Имя</label><input value="Пользователь TopGram" disabled /><p style="color:var(--muted);font-size:13px">Это демонстрационный профиль. Регистрация появится после подключения Supabase.</p>',closeModal,'Понятно');
  $('search').addEventListener('input',renderList);
  renderList();
})();
</script>
</body>
</html>
